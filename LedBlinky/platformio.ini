[platformio]
default_envs = led

; Cấu hình chung cho mọi env bên dưới
[env]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Bài 2: LED GPIO48 nhấp nháy 1 s, in trạng thái ra Serial
[env:led]
