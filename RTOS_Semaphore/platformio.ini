[platformio]
default_envs = mutex

; Cấu hình chung cho mọi env bên dưới
[env]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; pio run -e <tên env> -t upload
; Bản gốc của bạn: binary semaphore, nút BOOT -> LED nháy 3 lần
[env:binary]
build_src_filter = -<*> +<main_semaphore_binary.cpp>

; Bản gốc của bạn: counting semaphore, các lần nhấn được xếp hàng (tối đa 5)
[env:counting]
build_src_filter = -<*> +<main_semaphore_count.cpp>

; Bản dùng trong báo cáo: binary semaphore + mutex bảo vệ Serial, log TAKE/GIVE
[env:mutex]
build_src_filter = -<*> +<main_semaphore_mutex.cpp>
