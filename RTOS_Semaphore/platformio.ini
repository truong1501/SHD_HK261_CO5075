[platformio]
default_envs = mutex

[env]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Each environment builds exactly one src/main_*.cpp

; Binary semaphore: BOOT press -> LED blinks 3 times
[env:binary]
build_src_filter = -<*> +<main_semaphore_binary.cpp>

; Counting semaphore: presses are queued (max 5)
[env:counting]
build_src_filter = -<*> +<main_semaphore_count.cpp>

; Binary semaphore for signalling + mutex guarding Serial, with TAKE/GIVE log
[env:mutex]
build_src_filter = -<*> +<main_semaphore_mutex.cpp>
