[platformio]
default_envs = scan

; Cấu hình chung cho mọi env bên dưới
[env]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    robtillaart/DHT20@^0.3.3

; Mỗi env build đúng MỘT file main_*.cpp (mỗi file có setup()/loop() riêng)
; pio run -e scan -t upload    (bản dùng trong báo cáo: quét I2C + đọc DHT20 có xử lý lỗi)
[env:scan]
build_src_filter = -<*> +<main_i2c_scan.cpp>

; Bản gốc của bạn: 2 task LED + đọc DHT20 mỗi 5 s
[env:basic]
build_src_filter = -<*> +<main_dht20_basic.cpp>

; Bản gốc của bạn: task đọc DHT20 -> queue -> task in (producer/consumer)
[env:queue]
build_src_filter = -<*> +<main_dht20_queue.cpp>
