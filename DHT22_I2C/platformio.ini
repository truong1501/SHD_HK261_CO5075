[platformio]
default_envs = scan

[env]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    robtillaart/DHT20@^0.3.3

; Each environment builds exactly one src/main_*.cpp

; I2C bus scan + periodic DHT20 reading with error handling
[env:scan]
build_src_filter = -<*> +<main_i2c_scan.cpp>

; LED task + DHT20 task
[env:basic]
build_src_filter = -<*> +<main_dht20_basic.cpp>

; DHT20 producer -> FreeRTOS queue -> printer task
[env:queue]
build_src_filter = -<*> +<main_dht20_queue.cpp>

; DHT20 readings as JSON lines over USB serial, forwarded to CoreIOT by gateway/serial_gateway.py
[env:gateway]
build_src_filter = -<*> +<main_dht20_gateway.cpp>
